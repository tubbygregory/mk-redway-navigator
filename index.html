<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#a9251d" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MK Redway" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="description" content="Redway-first walking and cycling navigation for Milton Keynes." />
  <title>MK Redway Navigator</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" sizes="192x192" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
  <link rel="apple-touch-startup-image" href="./icons/iphone16-splash.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="preconnect" href="https://unpkg.com" crossorigin />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main id="app">
    <div id="map" aria-label="Interactive Redway navigation map"></div>

    <!-- Explore / destination search. Compact and map-first, inspired by familiar mapping-app interaction patterns. -->
    <section id="exploreUI" class="top-overlay" aria-label="Destination search">
      <form id="homeSearchForm" class="search-pill">
        <img src="./icons/app-logo.svg" class="search-logo" width="32" height="32" alt="" aria-hidden="true" />
        <label class="sr-only" for="homeSearch">Search for a destination</label>
        <input id="homeSearch" type="search" inputmode="search" enterkeyhint="search" autocomplete="street-address" autocapitalize="words" spellcheck="false" placeholder="Search place, address or postcode" />
        <button id="homeSearchSubmit" class="icon-button search-submit" type="submit" aria-label="Search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg>
        </button>
      </form>
    </section>

    <!-- Route planner shown after Directions. -->
    <section id="plannerUI" class="top-overlay planner-card" aria-label="Route planner" hidden>
      <button id="plannerBack" class="icon-button planner-back" type="button" aria-label="Back">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7"></path></svg>
      </button>
      <div class="planner-fields">
        <form id="startSearchForm" class="planner-row" data-kind="start">
          <span class="planner-dot start-dot" aria-hidden="true"></span>
          <label class="sr-only" for="startSearch">Starting location</label>
          <input id="startSearch" type="search" inputmode="search" enterkeyhint="search" autocomplete="street-address" autocapitalize="words" spellcheck="false" placeholder="Your location or starting point" />
          <button id="useLocationBtn" class="inline-icon" type="button" aria-label="Use current location">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v3M12 18v3M3 12h3M18 12h3"></path><circle cx="12" cy="12" r="4"></circle></svg>
          </button>
        </form>
        <div class="planner-divider"></div>
        <form id="endSearchForm" class="planner-row" data-kind="end">
          <span class="planner-dot end-dot" aria-hidden="true"></span>
          <label class="sr-only" for="endSearch">Destination</label>
          <input id="endSearch" type="search" inputmode="search" enterkeyhint="search" autocomplete="street-address" autocapitalize="words" spellcheck="false" placeholder="Destination" />
        </form>
      </div>
    </section>

    <!-- Contextual search results sheet. -->
    <section id="resultsSheet" class="bottom-sheet results-sheet" aria-label="Search results" hidden>
      <div class="grabber" aria-hidden="true"></div>
      <div class="sheet-heading">
        <strong id="resultsTitle">Search results</strong>
        <button id="closeResults" class="icon-button small-icon" type="button" aria-label="Close search results">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"></path></svg>
        </button>
      </div>
      <div id="resultsList" class="results-list"></div>
    </section>

    <!-- Selected destination, before calculating directions. -->
    <section id="placeSheet" class="bottom-sheet place-sheet" aria-label="Selected destination" hidden>
      <div class="grabber" aria-hidden="true"></div>
      <div class="place-title-row">
        <div class="place-copy">
          <strong id="placeName">Destination</strong>
          <span id="placeAddress"></span>
        </div>
        <button id="closePlace" class="icon-button small-icon" type="button" aria-label="Close destination">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"></path></svg>
        </button>
      </div>
      <button id="directionsBtn" class="primary-action" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4 11l8 10 8-10-8-8Z"></path><path d="M9 12h6M13 9l3 3-3 3"></path></svg>
        Directions
      </button>
    </section>

    <!-- Compact route preview. -->
    <section id="routeSheet" class="bottom-sheet route-sheet" aria-label="Route preview" hidden>
      <div class="grabber" aria-hidden="true"></div>
      <div class="mode-row" role="group" aria-label="Travel mode">
        <button id="cycleBtn" class="mode-chip active" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="17" r="3"></circle><circle cx="18" cy="17" r="3"></circle><path d="m6 17 4-8h4l4 8M9 11h6M11 6h3"></path></svg>
          Cycle
        </button>
        <button id="walkBtn" class="mode-chip" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="13" cy="4" r="2"></circle><path d="m12 7-2 5 3 2 2 6M10 12l-3 7M12 8l4 4 3 1"></path></svg>
          Walk
        </button>
        <button id="prefBtn" class="mode-chip preference-chip" type="button" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"></path><circle cx="15" cy="7" r="2"></circle><circle cx="9" cy="17" r="2"></circle></svg>
          <span id="prefLabel">Max Redway</span>
        </button>
      </div>
      <div id="prefMenu" class="pref-menu" hidden>
        <button type="button" data-pref="maximum" class="active">Maximum Redway</button>
        <button type="button" data-pref="balanced">Balanced</button>
        <button type="button" data-pref="fastest">Fastest</button>
      </div>

      <div class="route-summary">
        <div>
          <strong id="timeStat">—</strong>
          <span id="arrivalStat">Route preview</span>
        </div>
        <div class="route-meta">
          <span id="distanceStat">—</span>
          <span class="meta-separator">•</span>
          <span><b id="redwayStat">—</b> traffic-free</span>
        </div>
      </div>
      <div id="routeStatus" class="route-status" aria-live="polite">Choose a start and destination.</div>
      <div class="route-actions">
        <button id="startNavBtn" class="primary-action nav-start" type="button" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 7 18-7-4-7 4 7-18Z"></path></svg>
          Start
        </button>
        <button id="clearBtn" class="secondary-action" type="button">Clear</button>
      </div>
    </section>

    <!-- Live navigation UI. -->
    <section id="navBanner" class="nav-banner" aria-label="Next navigation instruction" hidden>
      <div id="turnIcon" class="turn-icon" aria-hidden="true">↑</div>
      <div class="turn-copy">
        <span id="turnDistance">Starting…</span>
        <strong id="turnText">Follow the route</strong>
        <small id="nextTurnText"></small>
      </div>
      <button id="voiceBtn" class="nav-round-button voice-on" type="button" aria-label="Mute voice guidance">
        <svg class="speaker-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10v4h4l5 4V6L9 10H5Z"></path><path d="M17 9c1 1 1 5 0 6M19 7c3 3 3 7 0 10"></path></svg>
        <svg class="speaker-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10v4h4l5 4V6L9 10H5Z"></path><path d="m18 10 4 4M22 10l-4 4"></path></svg>
      </button>
    </section>

    <div id="mapControls" class="map-controls" hidden>
      <button id="recenterBtn" class="nav-round-button" type="button" aria-label="Recenter map on your location">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v3M12 18v3M3 12h3M18 12h3"></path><circle cx="12" cy="12" r="4"></circle></svg>
      </button>
    </div>

    <section id="navBottom" class="nav-bottom" aria-label="Navigation status" hidden>
      <div class="nav-remaining">
        <strong id="navEta">—</strong>
        <span id="navRemain">—</span>
      </div>
      <button id="exitNavBtn" class="exit-button" type="button">Exit</button>
    </section>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="https://unpkg.com/@tomickigrzegorz/leaflet-rotate@0.2.4/dist/leaflet-rotate.umd.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
