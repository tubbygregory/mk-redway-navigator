name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "pdf-review-completion", "fix/v014-validation"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore last council cycle-path extract
        uses: actions/cache@v4
        with:
          path: |
            data/council_routes.geojson
            data/council-meta.json
          key: mk-redway-council-v2-${{ github.run_number }}
          restore-keys: |
            mk-redway-council-v2-

      - name: Restore last routing network
        uses: actions/cache@v4
        with:
          path: data/network.json
          key: mk-redway-routing-v8-${{ github.run_number }}
          restore-keys: |
            mk-redway-routing-v8-
            mk-redway-routing-v6-
            mk-redway-routing-v5-

      - name: Restore cached Geofabrik OSM extract
        uses: actions/cache@v4
        with:
          path: data/buckinghamshire-latest.osm.pbf
          key: mk-redway-osm-bucks-v1-${{ github.run_number }}
          restore-keys: |
            mk-redway-osm-bucks-v1-

      - name: Restore last offline basemap
        uses: actions/cache@v4
        with:
          path: |
            data/mk-basemap.pmtiles
            data/mk-basemap-build.txt
            data/mk-basemap-source-date.txt
          key: mk-redway-basemap-v1-${{ github.run_number }}
          restore-keys: |
            mk-redway-basemap-v1-

      - name: Install routing-data parser
        run: python3 -m pip install --disable-pip-version-check -r requirements.txt

      - name: Extract official Get Around MK cycle-path layers
        continue-on-error: true
        timeout-minutes: 8
        run: python3 scripts/extract_council_routes.py

      - name: Upload council extraction diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: council-extraction-diagnostics
          path: data/council-route-extract-diagnostics.json
          if-no-files-found: warn

      - name: Build current MK routing network
        continue-on-error: true
        timeout-minutes: 10
        run: FORCE_NETWORK_REFRESH=1 python3 scripts/build_network.py

      - name: Build offline Milton Keynes basemap
        continue-on-error: true
        timeout-minutes: 15
        run: bash scripts/build_offline_map.sh

      - name: Validate data and build runtime-only artifact
        run: python3 scripts/build_site.py

      - name: Test data validation and JavaScript syntax
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          node --check app.js
          node --check about.js
          node --check routing.js
          node --check sw.js

      - name: Test routing against generated network
        run: node --test tests/routing.test.cjs

      - name: Install browser release checks
        run: |
          python3 -m playwright install --with-deps chromium

      - name: Verify frontend routes before publication
        timeout-minutes: 10
        run: |
          python3 tests/browser_smoke.py
          python3 tests/pwa_smoke.py
          python3 tests/audit_browser.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Inspect actual Pages archive
        run: python3 scripts/check_pages_artifact.py "$RUNNER_TEMP/artifact.tar"

      - name: Upload browser captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-review
          path: test-results/
          if-no-files-found: warn

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  live-review:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: |
          python3 -m pip install -r requirements.txt
          python3 -m playwright install --with-deps chromium
      - name: Review deployed mobile application
        timeout-minutes: 10
        env:
          LIVE_URL: https://mkredway.co.uk/
        run: |
          python3 tests/pwa_smoke.py
          python3 tests/audit_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-mobile-review
          path: test-results/

  release:
    if: github.ref == 'refs/heads/main'
    needs: live-review
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Publish v0.14.0 beta release after production verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(cat VERSION)" != "0.14.0" ]; then exit 0; fi
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Design-review completion release.

          - Add local type-ahead suggestions, result pins, favourite chips and a first-run location explanation.
          - Add Explore MK Cultural Route cards, GPX import/export and shareable desktop-to-phone route links.
          - Add mapped lighting/underpass/crossing summaries, optional lit/Super Route preferences and richer turn guidance.
          - Add automatic after-sunset navigation dark mode, explicit appearance choices and move offline map management into Settings.
          - Generate routing network v6 with grid-road context for mapped underpasses.

          - Final audit: validate GPX coordinates and XML, keep imported geometry and unknown conditions distinct, escape map labels, and share imported tracks as files.
          - Keep discounted-route A* optimal, respect bicycle-specific one-way/roundabout rules, validate metadata types and label crossing estimates honestly.

          Limits: crossing estimates and OSM lighting coverage are incomplete. Cultural-route POI narration and calculated connectors to loops are not included. Multi-section GPX files use the longest continuous section rather than inventing connections.

          The normal data, routing, browser/PWA, focused audit, Pages-artifact, deployment and live-review gates pass before publication.
          NOTES
          if gh release view v0.14.0 >/dev/null 2>&1; then
            # The handoff's merge published this beta while the final audit was running.
            # Only advance a beta tag to a validated descendant; never rewrite history.
            test "$(gh release view v0.14.0 --json isPrerelease --jq .isPrerelease)" = true
            relation=$(gh api "repos/$GITHUB_REPOSITORY/compare/v0.14.0...$GITHUB_SHA" --jq .status)
            case "$relation" in ahead|identical) ;; *) exit 1 ;; esac
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/v0.14.0" -f sha="$GITHUB_SHA" -F force=false
            gh release edit v0.14.0 --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create v0.14.0 --target "$GITHUB_SHA" --title "MK Redway Navigator v0.14.0" --prerelease --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
