name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "pdf-review-completion", "fix/v014-validation", "fix/v014-appearance", "branding/mkrw-logo", "branding/mkrw-logo-fit", "audit/v0143", "fix/mobile-header-fit", "audit/reliability-v0145", "fix/exact-mk-logo-v0146", "fix/cultural-route-loading-v0147", "fix/mk-address-search-v0148", "fix/saved-cultural-ux-v0149", "polish/design-friendliness-v01410", "feature/navigation-map-icons", "reliability/automated-release-checks", "fix/narrow-route-alternatives", "fix/alternative-fixture-focus", "reliability/offline-update-recovery", "polish/concrete-cow-name", "integration/adsense-v01415", "integration/settings-ad-v01416", "fix/webkit-provider-isolation", "fix/start-pin-sharing-v01417"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore last council cycle-path extract
        uses: actions/cache@v4
        with:
          path: |
            data/council_routes.geojson
            data/council-meta.json
          key: mk-redway-council-v2-${{ github.run_number }}
          restore-keys: |
            mk-redway-council-v2-

      - name: Restore last routing network
        uses: actions/cache@v4
        with:
          path: data/network.json
          key: mk-redway-routing-v8-${{ github.run_number }}
          restore-keys: |
            mk-redway-routing-v8-
            mk-redway-routing-v6-
            mk-redway-routing-v5-

      - name: Restore cached Geofabrik OSM extract
        uses: actions/cache@v4
        with:
          path: data/buckinghamshire-latest.osm.pbf
          key: mk-redway-osm-bucks-v1-${{ github.run_number }}
          restore-keys: |
            mk-redway-osm-bucks-v1-

      - name: Restore last MK place index
        uses: actions/cache@v4
        with:
          path: data/places.json
          key: mk-redway-places-v1-${{ github.run_number }}
          restore-keys: |
            mk-redway-places-v1-

      - name: Restore last offline basemap
        uses: actions/cache@v4
        with:
          path: |
            data/mk-basemap.pmtiles
            data/mk-basemap-build.txt
            data/mk-basemap-source-date.txt
          key: mk-redway-basemap-v1-${{ github.run_number }}
          restore-keys: |
            mk-redway-basemap-v1-

      - name: Install routing-data parser
        run: python3 -m pip install --disable-pip-version-check -r requirements.txt

      - name: Extract official Get Around MK cycle-path layers
        continue-on-error: true
        timeout-minutes: 8
        run: python3 scripts/extract_council_routes.py

      - name: Upload council extraction diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: council-extraction-diagnostics
          path: data/council-route-extract-diagnostics.json
          if-no-files-found: warn

      - name: Build current MK routing network
        continue-on-error: true
        timeout-minutes: 10
        run: FORCE_NETWORK_REFRESH=1 python3 scripts/build_network.py

      - name: Build mapped MK place and address index
        continue-on-error: true
        timeout-minutes: 5
        run: python3 scripts/build_places.py

      - name: Build offline Milton Keynes basemap
        continue-on-error: true
        timeout-minutes: 15
        run: bash scripts/build_offline_map.sh

      - name: Generate branded PWA and browser icons
        run: |
          python3 -m pip install --disable-pip-version-check cairosvg==2.8.2 Pillow==11.3.0
          python3 scripts/build_icons.py

      - name: Validate data and build runtime-only artifact
        run: python3 scripts/build_site.py

      - name: Test data validation and JavaScript syntax
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          node --check app.js
          node --check about.js
          node --check routing.js
          node --check navigation-icons.js
          node --check sw.js

      - name: Test routing against generated network
        run: node --test tests/*.test.cjs

      - name: Install browser release checks
        run: |
          python3 -m playwright install --with-deps chromium

      - name: Verify frontend routes before publication
        timeout-minutes: 10
        run: |
          python3 tests/browser_smoke.py
          python3 tests/pwa_smoke.py
          python3 tests/audit_browser.py
          python3 tests/design_polish_browser.py
          python3 tests/navigation_icons_browser.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Inspect actual Pages archive
        run: python3 scripts/check_pages_artifact.py "$RUNNER_TEMP/artifact.tar"

      - name: Upload browser captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-review
          path: test-results/
          if-no-files-found: warn

  reliability-checks:
    name: Release reliability (${{ matrix.gate }})
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - gate: upgrade
            browser: chromium
            script: release_upgrade_browser.py
          - gate: webkit
            browser: webkit
            script: webkit_browser.py
          - gate: accessibility
            browser: chromium
            script: accessibility_browser.py
          - gate: offline-recovery
            browser: chromium
            script: offline_recovery_browser.py
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Download the inspected Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: pages-artifact
      - name: Extract the runtime under test
        run: |
          mkdir -p dist
          tar -xf pages-artifact/artifact.tar -C dist
      - name: Install the required test browser
        run: |
          python3 -m pip install -r requirements.txt
          python3 -m playwright install --with-deps ${{ matrix.browser }}
      - name: Check release reliability
        timeout-minutes: 10
        run: python3 tests/${{ matrix.script }}
      - name: Check live location permission recovery
        if: matrix.gate == 'offline-recovery'
        timeout-minutes: 3
        run: python3 tests/navigation_permission_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reliability-${{ matrix.gate }}
          path: test-results/
          if-no-files-found: warn

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build, reliability-checks]
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  live-review:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: |
          python3 -m pip install -r requirements.txt
          python3 -m playwright install --with-deps chromium
      - name: Review deployed mobile application
        timeout-minutes: 10
        env:
          LIVE_URL: https://mkredway.co.uk/
        run: |
          python3 tests/pwa_smoke.py
          python3 tests/audit_browser.py
          python3 tests/design_polish_browser.py
          python3 tests/navigation_icons_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-mobile-review
          path: test-results/

  live-reliability:
    name: Live reliability (${{ matrix.gate }})
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - gate: webkit
            browser: webkit
            script: webkit_browser.py
          - gate: accessibility
            browser: chromium
            script: accessibility_browser.py
    steps:
      - uses: actions/checkout@v6
      - name: Install the required test browser
        run: |
          python3 -m pip install -r requirements.txt
          python3 -m playwright install --with-deps ${{ matrix.browser }}
      - name: Check the deployed application
        timeout-minutes: 10
        env:
          LIVE_URL: https://mkredway.co.uk/
        run: python3 tests/${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-reliability-${{ matrix.gate }}
          path: test-results/
          if-no-files-found: warn

  release:
    if: github.ref == 'refs/heads/main'
    needs: [live-review, live-reliability]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Publish v0.14.17 beta release after production verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(cat VERSION)" != "0.14.17" ]; then exit 0; fi
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Choose a route starting point on the map and transfer routes to a phone with clear, recoverable actions.

          - Offer Choose on map directly in the starting-point picker, suggestions and route search results.
          - Preserve Cultural Route colours and calculate the red joining leg from a dropped starting pin.
          - Cancel obsolete GPS/navigation starts and route work while choosing a replacement point.
          - Replace silent phone-transfer fallbacks with a persistent route-link panel and explicit Copy and Share actions.
          - Keep manual link copying available when clipboard or native sharing fails or is cancelled.
          - Offer explicit GPX sharing/download with recovery, preserving original Cultural Route source geometry.
          - Retain all artifact, upgrade, offline, accessibility and production live-review gates.

          Published after the inspected artifact, deployment and all production live-review gates.
          NOTES
          if gh release view v0.14.17 >/dev/null 2>&1; then
            # An existing release may only be retried for the same commit.
            test "$(gh api "repos/$GITHUB_REPOSITORY/commits/v0.14.17" --jq .sha)" = "$GITHUB_SHA"
            gh release edit v0.14.17 --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create v0.14.17 --target "$GITHUB_SHA" --title "MK Redway Navigator v0.14.17" --prerelease --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
