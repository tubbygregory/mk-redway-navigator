name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore last council cycle-path extract
        uses: actions/cache@v4
        with:
          path: data/council_routes.geojson
          key: mk-redway-council-v1-${{ github.run_number }}
          restore-keys: |
            mk-redway-council-v1-

      - name: Restore last routing network
        uses: actions/cache@v4
        with:
          path: data/network.json
          key: mk-redway-routing-v5-${{ github.run_number }}
          restore-keys: |
            mk-redway-routing-v5-
            mk-redway-routing-v4-
            mk-redway-routing-v3-

      - name: Restore cached Geofabrik OSM extract
        uses: actions/cache@v4
        with:
          path: data/buckinghamshire-latest.osm.pbf
          key: mk-redway-osm-bucks-v1-${{ github.run_number }}
          restore-keys: |
            mk-redway-osm-bucks-v1-

      - name: Restore last offline basemap
        uses: actions/cache@v4
        with:
          path: |
            data/mk-basemap.pmtiles
            data/mk-basemap-build.txt
          key: mk-redway-basemap-v1-${{ github.run_number }}
          restore-keys: |
            mk-redway-basemap-v1-

      - name: Install council-map extractor
        continue-on-error: true
        timeout-minutes: 8
        run: |
          python3 -m pip install --disable-pip-version-check playwright
          python3 -m playwright install --with-deps chromium

      - name: Install routing-data parser
        run: python3 -m pip install --disable-pip-version-check osmium

      - name: Extract official Get Around MK cycle-path layers
        continue-on-error: true
        timeout-minutes: 8
        run: python3 scripts/extract_council_routes.py

      - name: Build current MK routing network
        continue-on-error: true
        timeout-minutes: 10
        run: python3 scripts/build_network.py

      - name: Build offline Milton Keynes basemap
        continue-on-error: true
        timeout-minutes: 15
        run: bash scripts/build_offline_map.sh

      - name: Verify offline data
        run: |
          if [ -f data/council_routes.geojson ]; then
            echo "Official council cycle-path extract is present ($(du -h data/council_routes.geojson | cut -f1))."
          else
            echo "::warning::No council cycle-path extract is present. The router will use its OSM/corridor fallback classification."
          fi
          if [ -f data/network.json ]; then
            echo "Bundled routing network is present ($(du -h data/network.json | cut -f1))."
          else
            echo "::warning::No bundled routing network was generated. The app will use its slower live fallback."
          fi
          if [ -f data/mk-basemap.pmtiles ]; then
            echo "Offline basemap is present ($(du -h data/mk-basemap.pmtiles | cut -f1))."
          else
            echo "::warning::No offline basemap was generated. Online mapping will still work."
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
