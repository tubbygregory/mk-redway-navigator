name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "pdf-review-completion", "fix/v014-validation", "fix/v014-appearance", "branding/mkrw-logo", "branding/mkrw-logo-fit", "audit/v0143", "fix/mobile-header-fit", "audit/reliability-v0145", "fix/exact-mk-logo-v0146", "fix/cultural-route-loading-v0147", "fix/mk-address-search-v0148", "fix/saved-cultural-ux-v0149", "polish/design-friendliness-v01410", "feature/navigation-map-icons"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore last council cycle-path extract
        uses: actions/cache@v4
        with:
          path: |
            data/council_routes.geojson
            data/council-meta.json
          key: mk-redway-council-v2-${{ github.run_number }}
          restore-keys: |
            mk-redway-council-v2-

      - name: Restore last routing network
        uses: actions/cache@v4
        with:
          path: data/network.json
          key: mk-redway-routing-v8-${{ github.run_number }}
          restore-keys: |
            mk-redway-routing-v8-
            mk-redway-routing-v6-
            mk-redway-routing-v5-

      - name: Restore cached Geofabrik OSM extract
        uses: actions/cache@v4
        with:
          path: data/buckinghamshire-latest.osm.pbf
          key: mk-redway-osm-bucks-v1-${{ github.run_number }}
          restore-keys: |
            mk-redway-osm-bucks-v1-

      - name: Restore last MK place index
        uses: actions/cache@v4
        with:
          path: data/places.json
          key: mk-redway-places-v1-${{ github.run_number }}
          restore-keys: |
            mk-redway-places-v1-

      - name: Restore last offline basemap
        uses: actions/cache@v4
        with:
          path: |
            data/mk-basemap.pmtiles
            data/mk-basemap-build.txt
            data/mk-basemap-source-date.txt
          key: mk-redway-basemap-v1-${{ github.run_number }}
          restore-keys: |
            mk-redway-basemap-v1-

      - name: Install routing-data parser
        run: python3 -m pip install --disable-pip-version-check -r requirements.txt

      - name: Extract official Get Around MK cycle-path layers
        continue-on-error: true
        timeout-minutes: 8
        run: python3 scripts/extract_council_routes.py

      - name: Upload council extraction diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: council-extraction-diagnostics
          path: data/council-route-extract-diagnostics.json
          if-no-files-found: warn

      - name: Build current MK routing network
        continue-on-error: true
        timeout-minutes: 10
        run: FORCE_NETWORK_REFRESH=1 python3 scripts/build_network.py

      - name: Build mapped MK place and address index
        continue-on-error: true
        timeout-minutes: 5
        run: python3 scripts/build_places.py

      - name: Build offline Milton Keynes basemap
        continue-on-error: true
        timeout-minutes: 15
        run: bash scripts/build_offline_map.sh

      - name: Generate branded PWA and browser icons
        run: |
          python3 -m pip install --disable-pip-version-check cairosvg==2.8.2 Pillow==11.3.0
          python3 scripts/build_icons.py

      - name: Validate data and build runtime-only artifact
        run: python3 scripts/build_site.py

      - name: Test data validation and JavaScript syntax
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          node --check app.js
          node --check about.js
          node --check routing.js
          node --check navigation-icons.js
          node --check sw.js

      - name: Test routing against generated network
        run: node --test tests/*.test.cjs

      - name: Install browser release checks
        run: |
          python3 -m playwright install --with-deps chromium

      - name: Verify frontend routes before publication
        timeout-minutes: 10
        run: |
          python3 tests/browser_smoke.py
          python3 tests/pwa_smoke.py
          python3 tests/audit_browser.py
          python3 tests/design_polish_browser.py
          python3 tests/navigation_icons_browser.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Inspect actual Pages archive
        run: python3 scripts/check_pages_artifact.py "$RUNNER_TEMP/artifact.tar"

      - name: Upload browser captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-review
          path: test-results/
          if-no-files-found: warn

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  live-review:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: |
          python3 -m pip install -r requirements.txt
          python3 -m playwright install --with-deps chromium
      - name: Review deployed mobile application
        timeout-minutes: 10
        env:
          LIVE_URL: https://mkredway.co.uk/
        run: |
          python3 tests/pwa_smoke.py
          python3 tests/audit_browser.py
          python3 tests/design_polish_browser.py
          python3 tests/navigation_icons_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-mobile-review
          path: test-results/

  release:
    if: github.ref == 'refs/heads/main'
    needs: live-review
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Publish v0.14.11 beta release after production verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(cat VERSION)" != "0.14.11" ]; then exit 0; fi
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Choose how your location appears on the map.

          - Add Red dot, Arrow, Cyclist and MK Cow under Settings → Appearance → Your map icon.
          - Use a red-and-white vector of the specifically requested foreground Concrete Cow, with a white outline.
          - Save the choice on this device, with honest feedback when browser storage is unavailable.
          - Keep artwork bundled for offline use and root/subpath installs, with no remote icon requests or extra location prompts.
          - Point the arrow using reliable measured travel, compensate for map rotation, and keep the cyclist and cow upright.
          - Retain the red dot default, existing navigation/routing behaviour, approved MK branding and source attribution.

          Published after build, artifact, deployment and live-review checks.
          NOTES
          if gh release view v0.14.11 >/dev/null 2>&1; then
            # An existing release may only be retried for the same commit.
            test "$(gh api "repos/$GITHUB_REPOSITORY/commits/v0.14.11" --jq .sha)" = "$GITHUB_SHA"
            gh release edit v0.14.11 --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create v0.14.11 --target "$GITHUB_SHA" --title "MK Redway Navigator v0.14.11" --prerelease --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
